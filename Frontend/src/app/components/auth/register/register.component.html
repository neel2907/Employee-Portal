<div class="register-container">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <h2>Register</h2>

    <div>
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />
      <div *ngIf="submitted && name.errors" class="error-message">
        <small *ngIf="name.errors['required']">Name is required.</small>
      </div>
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <div *ngIf="submitted && email.errors" class="error-message">
        <small *ngIf="email.errors['required']">Email is required.</small>
        <small *ngIf="email.errors['email']">Email must be valid.</small>
      </div>
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
      <div *ngIf="submitted && password.errors" class="error-message">
        <small *ngIf="password.errors['required']">Password is required.</small>
        <small *ngIf="password.errors['minlength']">
          Password must be at least 6 characters.
        </small>
      </div>
    </div>

    <div>
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" />
      <div *ngIf="submitted && confirmPassword.errors" class="error-message">
        <small *ngIf="confirmPassword.errors['required']">Confirm Password is required.</small>
        <small *ngIf="confirmPassword.errors['mismatch']">Passwords do not match.</small>
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Registering...' : 'Register' }}
    </button>
  </form>
</div>
