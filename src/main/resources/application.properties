# Application name
spring.application.name=EmployeePortalBackend

# Server configuration
server.port=8090

# Datasource (Oracle example, change as per your DB)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xe
spring.datasource.username=EmployeePortal
spring.datasource.password=1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver




# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.id.new_generator_mappings=true


# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT / Security placeholders (you can fill these when you add security)
jwt.secret=your_jwt_secret_key
jwt.expiration=3600000  # 1 hour in milliseconds

# Papercut SMTP server config for testing emails
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=   # usually not required for Papercut
spring.mail.password=   # usually not required for Papercut
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# CORS config if Angular frontend is on a different port/domain
# spring.web.cors.allowed-origins=http://localhost:4200

